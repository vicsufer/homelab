---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: monitoring
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: prometheus
      hostname: prometheus.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: prometheus-general-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: grafana
      hostname: grafana.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-general-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: alertmanager
      hostname: alertmanager.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: alertmanager-general-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prometheus"
    gethomepage.dev/description: "Prometheus"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/widget.type: "prometheus"
    gethomepage.dev/widget.url: "https://prometheus.vicsufer.xyz"
    gethomepage.dev/icon: "prometheus.png"
    gethomepage.dev/href: "https://prometheus.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: monitoring
      sectionName: prometheus
  hostnames:
    - prometheus.vicsufer.xyz
  rules:
    - backendRefs:
        - name: prometheus-stack-kube-prom-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Grafama"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.url: "https://grafana.vicsufer.xyz"
    gethomepage.dev/widget.username: "admin"
    gethomepage.dev/widget.password: "prom-operator"
    gethomepage.dev/icon: "grafana.png"
    gethomepage.dev/href: "https://grafana.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: monitoring
      sectionName: grafana
  hostnames:
    - grafana.vicsufer.xyz
  rules:
    - backendRefs:
        - name: prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Alertmanager"
    gethomepage.dev/description: "Alertmanager"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/href: "https://alertmanager.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: monitoring
      sectionName: alertmanager
  hostnames:
    - alertmanager.vicsufer.xyz
  rules:
    - backendRefs:
        - name: prometheus-stack-kube-prom-alertmanager
          port: 9093
