---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: victoria-metrics
  namespace: argocd
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: victoria-metrics-single
      repoURL: https://victoriametrics.github.io/helm-charts
      targetRevision: 0.52.0
      helm:
        releaseName: victoria-metrics
        valueFiles:
          - $values/kluster-manifests/argocd-apps/monitoring/values/victoria-metrics.values.yaml
    - repoURL: https://github.com/vicsufer/homelab
      path: kluster-manifests/argocd-apps/monitoring/values
      targetRevision: HEAD
      ref: values
