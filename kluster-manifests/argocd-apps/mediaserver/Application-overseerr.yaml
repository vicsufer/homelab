---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: overseerr
  namespace: argocd
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mediaserver
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  sources:
    - repoURL: https://charts.pree.dev
      chart: overseerr
      targetRevision: 1.2.0
      helm:
        releaseName: overseerr
        valueFiles:
          - $values/kluster-manifests/argocd-apps/mediaserver/values/overseerr.values.yaml
    - repoURL: https://github.com/vicsufer/homelab
      path: kluster-manifests/argocd-apps/mediaserver/values
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/vicsufer/homelab
      targetRevision: HEAD
      path: kluster-manifests/argocd-apps/mediaserver/overseerr-extras
