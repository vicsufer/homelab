---
apiVersion: v1
kind: Service
metadata:
  name: external-pihole
  namespace: kgateway-system
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-pihole-1
  namespace: kgateway-system
  labels:
    kubernetes.io/service-name: external-pihole
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.20
ports:
  - name: http
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: pihole
  namespace: kgateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pihole.vicsufer.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - name: pihole-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: pihole
      sectionName: https
  hostnames:
    - pihole.vicsufer.xyz
  rules:
    - backendRefs:
        - name: external-pihole
          port: 80
