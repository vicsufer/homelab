---
# Argo CD excludes EndpointSlices by default, so the external Pi-hole is
# expressed as a kgateway static Backend instead of a selector-less Service.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: pihole
  namespace: kgateway-system
spec:
  type: Static
  static:
    hosts:
      - host: 192.168.1.20
        port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: pihole
  namespace: kgateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pihole.vicsufer.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - name: pihole-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: pihole
      sectionName: https
  hostnames:
    - pihole.vicsufer.xyz
  rules:
    - backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: pihole
