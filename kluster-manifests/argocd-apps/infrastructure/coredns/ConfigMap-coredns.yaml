---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |-
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            ttl 30
        }
        # gRPC clients (e.g. ArgoCD -> argocd-repo-server) look up _grpclb SRV records for
        # short names; answer them here instead of forwarding junk queries to Pi-hole.
        template IN SRV . {
            match "^_grpclb\._tcp\.[^.]+\.$"
            rcode NXDOMAIN
            fallthrough
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
