---
provider:
  name: pihole
policy: sync
registry: txt
sources:
  - gateway-httproute

extraArgs:
  - --pihole-api-version=6
  - --pihole-tls-skip-verify

env:
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pihole-secret
        key: EXTERNAL_DNS_PIHOLE_PASSWORD
  - name: EXTERNAL_DNS_PIHOLE_SERVER
    valueFrom:
      secretKeyRef:
        name: pihole-secret
        key: EXTERNAL_DNS_PIHOLE_SERVER

enableGatewayListenerSets: true
