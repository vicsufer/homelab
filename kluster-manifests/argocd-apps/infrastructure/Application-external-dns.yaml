---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: external-dns
  namespace: argocd
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.23.0
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/kluster-manifests/argocd-apps/infrastructure/values/external-dns.values.yaml
    - repoURL: https://github.com/vicsufer/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/vicsufer/homelab.git
      targetRevision: HEAD
      path: kluster-manifests/argocd-apps/infrastructure/external-dns-extras
