---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: maybe-finance
  namespace: maybefinance
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      hostname: maybe.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: maybe-general-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maybe-finance
  namespace: maybefinance
  annotations:
    gethomepage.dev/href: "https://maybe.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: maybe-finance
      sectionName: https
  hostnames:
    - maybe.vicsufer.xyz
  rules:
    - backendRefs:
        - name: maybefinance
          port: 3000
