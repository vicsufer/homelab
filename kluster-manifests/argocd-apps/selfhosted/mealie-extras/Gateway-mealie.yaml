---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: mealie
  namespace: mealie
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      hostname: recetas.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: mealie-general-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: mealie
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Recetas"
    gethomepage.dev/description: "Recetario"
    gethomepage.dev/group: "k3s"
    gethomepage.dev/widget.type: "mealie"
    gethomepage.dev/widget.url: "http://mealie.mealie.svc:9000"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
    gethomepage.dev/widget.version: "2"
    gethomepage.dev/icon: "mealie.png"
    gethomepage.dev/href: "https://recetas.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: mealie
      sectionName: https
  hostnames:
    - recetas.vicsufer.xyz
  rules:
    - backendRefs:
        - name: mealie
          port: 9000
