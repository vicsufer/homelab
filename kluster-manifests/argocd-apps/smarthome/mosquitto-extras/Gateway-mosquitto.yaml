---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: mosquitto
  namespace: zigbee
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      hostname: mqtt.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: mqtt-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mosquitto
  namespace: zigbee
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Mosquitto"
    gethomepage.dev/description: "MQTT broker"
    gethomepage.dev/group: "Smart Home"
    gethomepage.dev/icon: "mqtt.png"
    gethomepage.dev/href: "https://mqtt.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: mosquitto
      sectionName: https
  hostnames:
    - mqtt.vicsufer.xyz
  rules:
    - backendRefs:
        - name: mosquitto
          port: 9001
