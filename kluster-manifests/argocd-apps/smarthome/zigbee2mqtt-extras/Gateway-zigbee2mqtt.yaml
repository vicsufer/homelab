---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: zigbee2mqtt
  namespace: zigbee
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kgateway-system
  listeners:
    - name: https
      hostname: zigbee2mqtt.vicsufer.xyz
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: zigbee2mqtt-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: zigbee
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Zigbee2MQTT"
    gethomepage.dev/description: "Zigbee Bridge"
    gethomepage.dev/group: "Smart Home"
    gethomepage.dev/icon: "zigbee2mqtt.png"
    gethomepage.dev/href: "https://zigbee2mqtt.vicsufer.xyz"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: zigbee2mqtt
      sectionName: https
  hostnames:
    - zigbee2mqtt.vicsufer.xyz
  rules:
    - backendRefs:
        - name: zigbee2mqtt
          port: 8080
