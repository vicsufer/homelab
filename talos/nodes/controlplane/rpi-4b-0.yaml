---
# ip: 192.168.1.40
# Static address: the Pi's MAC changed across boots, so a DHCP reservation isn't reliable.
# It must match the cluster endpoint in render.sh.
machine:
  network:
    # Existing Kubernetes node name (etcd snapshot); changing it registers a new node
    hostname: talos-hlb-vdh
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.40/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
    nameservers:
      - 192.168.1.20
      - 1.1.1.1
  install:
    disk: /dev/mmcblk0
    # schematics/rpi_generic.yaml
    image: factory.talos.dev/installer/f47e6cd2634c7a96988861031bcc4144468a1e3aef82cca4f5b5ca3fffef778a:v1.11.0
